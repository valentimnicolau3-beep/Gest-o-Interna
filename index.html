 ${(()=>{const l=S.products.filter(p=>p.type=='p'&&(p.min||0)>0&&p.stock<=p.min);return l.length?'<h3>⚠ Material a acabar</h3>'+l.map(p=>`<div class="card row"><span>${p.name}</span><b class=red>${+p.stock.toFixed(2)}</b></div>`).join(''):''})()}<h3>Carteiras</h3>${W.map(w=>w=='Bolso do dono'?`<div class="card row"><span>Bolso do dono (já pôs)</span><b>${f(-bal(w))}</b></div>`:`<div class="card row"><span>${w}</span><b>${f(bal(w))}</b></div>`).join('')}
 <h3>Despesas do mês</h3>${Object.keys(bc).length?Object.entries(bc).map(([c,v])=>`<div class="card row"><span>${c}</span><b class=red>${f(v)}</b></div>`).join(''):'<div class=card>Sem despesas este mês.</div>'}<button class="btn g" onclick=bk()>Descarregar cópia de segurança</button>`}
function sell(){
 const sub=cart.reduce((a,c)=>a+c.q*c.pr,0),tot=Math.max(sub-dc,0);
 return `<h3>Carrinho</h3>`+(cart.length?cart.map(c=>`<div class=card><div class=row><span>${P(c.id).name}</span><b>${f(c.q*c.pr)}</b></div><div class=row><span class=q><button onclick="qty('${c.id}',-1)">−</button>${c.q}<button onclick="qty('${c.id}',1)">+</button></span><input type=number inputmode=decimal value="${c.pr}" onchange="setP('${c.id}',this.value)" style="width:130px" title="Preço"></div></div>`).join(''):'<div class=card>Toque num item abaixo para adicionar.</div>')+
 `<input type=number inputmode=decimal placeholder="Desconto (MT)" value="${dc||''}" onchange="setD(this.value)">
 <div class="card row"><b>Total</b><b class=big>${f(tot)}</b></div>
 <select id=pw>${W.slice(0,6).map(w=>`<option>${w}</option>`).join('')}</select><input id=pp type=number inputmode=decimal value="${tot}" placeholder="Valor pago agora">
 <select id=pc><option value="">Cliente (só se ficar a dever)</option>${S.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
 <button class=btn onclick=pay()>Cobrar</button><h3>Itens</h3><input placeholder="Buscar produto ou serviço" oninput="flt(this.value)">`+
 S.products.filter(p=>!(p.cat=='Material'&&!p.price)).map(p=>`<div class="card row it" data-n="${(p.name+' '+(p.cat||'')).toLowerCase()}" onclick="add('${p.id}')"><span>${p.name}<small>${p.cat||''}${p.type=='p'?' · Stock: '+p.stock:''}</small></span><b>${f(p.price)}</b></div>`).join('')+(S.products.length?'':'<div class=card>Cadastre itens no Catálogo.</div>')}
function flt(v){document.querySelectorAll('.it').forEach(e=>e.style.display=e.dataset.n.includes(v.toLowerCase())?'':'none')}
function add(id){const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1,pr:P(id).price});render();scrollTo(0,0)}
function setP(id,v){cart.find(x=>x.id==id).pr=+v||0;render()}
function setD(v){dc=+v||0;render()}
function qty(id,d){const c=cart.find(x=>x.id==id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);render()}
function pay(){
 if(!cart.length)return alert('O carrinho está vazio.');
 const sub=cart.reduce((a,c)=>a+c.q*c.pr,0),tot=Math.max(sub-dc,0),w=$('#pw').value,paid=Math.min(Math.max(+$('#pp').value||0,0),tot),cl=$('#pc').value;
 if(paid<tot&&!cl)return alert('Escolha o cliente para a parte que fica a dever.');
 for(const c of cart){const p=P(c.id);if(p.type=='p'&&p.stock<c.q)return alert('Stock insuficiente: '+p.name)}
 const low=[],bn=n=>S.products.find(x=>x.name.toLowerCase()==n.toLowerCase()),items=cart.map(c=>{const p=P(c.id);let cs=p.cost;if(p.type=='p')p.stock-=c.q;(p.use||[]).forEach(u=>{const m=bn(u.n);if(m){m.stock-=u.q*c.q;cs+=m.cost*u.q;if(m.stock<=(m.min||0)&&!low.includes(m.name))low.push(m.name)}});return{n:p.name,q:c.q,p:c.pr,c:cs}});
 if(paid>0)S.moves.push({id:uid(),d:Date.now(),k:'venda',t:'Venda',w,a:paid});
 if(paid<tot)S.clients.find(x=>x.id==cl).debt+=tot-paid;
 S.sales.push({id:uid(),d:Date.now(),items,tot,dc,paid,cl});cart=[];dc=0;save();render();alert('Venda registada.'+(low.length?'\nAtenção, material a acabar: '+low.join(', '):''))}
function cat(){
 const cs=[...new Set(S.products.map(p=>p.cat).filter(Boolean))];
 return `<button class="btn g" onclick=imp()>Carregar tabela de preços</button><h3>Novo item</h3><input id=qn placeholder="Nome"><input id=qg list=cl placeholder="Categoria (ex.: Reprografia)"><datalist id=cl>${cs.map(c=>`<option>${c}</option>`).join('')}</datalist>
 <select id=qt><option value=s>Serviço (sem stock)</option><option value=p>Produto (com stock)</option></select>
 <div class=grid><input id=qc type=number inputmode=decimal placeholder="Custo"><input id=qr type=number inputmode=decimal placeholder="Preço de venda"></div>
 <input id=qs type=number placeholder="Stock inicial (só produtos)"><button class=btn onclick=addP()>Guardar item</button>
 <h3>Itens (${S.products.length})</h3><input placeholder="Buscar no catálogo" oninput="flt(this.value)">`+
 S.products.map(p=>`<div class="card row it" data-n="${(p.name+' '+(p.cat||'')).toLowerCase()}"><span>${p.name}<small>${p.cat||''} · ${p.type=='p'?'Stock '+p.stock+' · ':''}custo ${f(p.cost)}</small></span><b>${f(p.price)}</b><span><button onclick="edP('${p.id}')">✎</button>${p.type=='p'?`<button onclick="repor('${p.id}')">+</button>`:''}<button onclick="delP('${p.id}')">✕</button></span></div>`).join('')}
function addP(){const n=$('#qn').value.trim();if(!n)return alert('Escreva o nome.');S.products.push({id:uid(),name:n,cat:$('#qg').value.trim(),type:$('#qt').value,cost:+$('#qc').value||0,price:+$('#qr').value||0,stock:+$('#qs').value||0});save();render()}
function imp(){if(!confirm('Carregar a tabela de preços? Itens que já existem não se repetem.'))return;
 const have=new Set(S.products.map(p=>p.name.toLowerCase()));let n=0;
 T.split('\n').forEach(l=>{const[c,nm,pr,t,co]=l.split('|');if(!nm||have.has(nm.toLowerCase()))return;S.products.push({id:uid(),name:nm,cat:c,type:t||'s',cost:+co||0,price:+pr,stock:0});n++});
 save();render();alert(n+' itens carregados.')}
function edP(id){const p=P(id),v=prompt('Novo preço de venda de '+p.name+' (MT):',p.price);if(v===null)return;const c=prompt('Custo por unidade (MT):',p.cost);let k=null,m=null;if(p.type=='p'){k=prompt('Stock atual (unidades):',p.stock);m=prompt('Avisar quando o stock chegar a (unidades):',p.min||0)}p.price=+v||0;if(c!==null)p.cost=+c||0;if(k!==null&&k!=='')p.stock=+k;if(m!==null&&m!=='')p.min=+m;save();render()}
function repor(id){const p=P(id),q=+prompt('Quantas unidades entraram em stock?');if(!q||q<=0)return;const c=prompt('Custo por unidade (deixe vazio para manter '+p.cost+'):');p.stock+=q;if(c)p.cost=+c;save();render()}
function delP(id){if(confirm('Apagar este item?')){S.products=S.products.filter(p=>p.id!=id);save();render()}}
function mov(){return `<h3>Registar movimento</h3><select id=mt><option value=out>Saída (despesa)</option><option value=in>Entrada (aporte / ajuste)</option></select>
 <select id=mc>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id=md placeholder="Descrição (ex.: táxi para buscar papel)"><input id=mv type=number inputmode=decimal placeholder="Valor (MT)"><select id=mw>${opts()}</select>
 <button class=btn onclick=addM()>Guardar</button><h3>Últimos movimentos</h3>`+
 S.moves.slice(-40).reverse().map(m=>`<div class="card row"><span>${m.t}<small>${m.c?m.c+' · ':''}${m.w} · ${dt(m.d)}</small></span><b class="${m.a<0?'red':'ok'}">${f(m.a)}</b>${m.k=='despesa'||m.k=='aporte'?`<span>${m.k=='despesa'?`<button onclick="edM('${m.id}')">✎</button>`:''}<button onclick="delM('${m.id}')">✕</button></span>`:''}</div>`).join('')}
function edM(id){const m=S.moves.find(x=>x.id==id),i=+prompt('Nova categoria: '+CATS.map((c,i)=>(i+1)+'='+c).join('  '))-1;if(!CATS[i])return;m.c=CATS[i];save();render()}
function delM(id){if(!confirm('Apagar este movimento? O saldo da carteira será recalculado.'))return;S.moves=S.moves.filter(x=>x.id!=id);(S.del=S.del||[]).push(id);save();render()}
function addM(){const v=+$('#mv').value;if(!v||v<=0)return alert('Indique o valor.');const o=$('#mt').value=='out',w=$('#mw').value,c=$('#mc').value;
 if(o&&w!='Bolso do dono'&&bal(w)<v&&!confirm('Saldo de '+w+' insuficiente. Registar mesmo assim?'))return;
 S.moves.push({id:uid(),d:Date.now(),k:o?'despesa':'aporte',c:o?c:'',t:$('#md').value||(o?c:'Aporte'),w,a:o?-v:v});save();render()}
function cli(){return `<h3>Novo cliente</h3><input id=cn placeholder="Nome"><input id=cp placeholder="Telefone" inputmode=tel><button class=btn onclick=addC()>Guardar cliente</button><h3>Clientes</h3>`+
 [...S.clients].sort((a,b)=>b.debt-a.debt).map(c=>`<div class="card row"><span>${c.name}<small>${c.phone||''}</small></span><b class="${c.debt>0?'red':''}">${c.debt>0?'Deve '+f(c.debt):'Sem dívida'}</b>${c.debt>0?`<button onclick="rec('${c.id}')">Receber</button>`:''}</div>`).join('')}
function addC(){const n=$('#cn').value.trim();if(!n)return alert('Escreva o nome.');S.clients.push({id:uid(),name:n,phone:$('#cp').value,debt:0});save();render()}
function rec(id){const c=S.clients.find(x=>x.id==id),v=+prompt('Valor recebido de '+c.name+' (MT):',c.debt);if(!v||v<=0)return;
 const i=+prompt('Carteira: '+W.map((w,i)=>(i+1)+'='+w).join('  '),1)-1;if(!W[i])return;
 const x=Math.min(v,c.debt);c.debt-=x;S.moves.push({id:uid(),d:Date.now(),k:'recebimento',t:'Recebido de '+c.name,w:W[i],a:x});save();render()}
